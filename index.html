<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- **NEW**: Explicit HTML5 compatibility meta tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <!-- **NEW**: HTML5 feature detection and compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- **NEW**: HTML5 Canvas and WebGL support declaration -->
    <meta name="supported-color-schemes" content="light dark" />
    
    <title>CircuitExp1</title>
    <!-- Production CSP with nonce -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'; style-src 'self' 'nonce-{{CSP_NONCE}}'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests; block-all-mixed-content">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- **NEW**: HTML5 feature detection script -->
    <script>
      // Detect HTML5 support and log compatibility status
      (function() {
        var html5Support = {
          canvas: !!document.createElement('canvas').getContext,
          webgl: !!window.WebGLRenderingContext,
          svg: !!document.createElementNS && !!document.createElementNS('http://www.w3.org/2000/svg', 'svg').createSVGRect,
          localStorage: !!window.localStorage,
          sessionStorage: !!window.sessionStorage
        };
        
        // Log HTML5 compatibility for debugging
        if (window.console && window.console.log) {
          console.log('HTML5 Feature Support:', html5Support);
        }
        
        // Store for application use
        window.HTML5_SUPPORT = html5Support;
      })();
    </script>
  </body>
</html>
